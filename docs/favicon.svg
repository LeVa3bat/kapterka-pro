<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2e1e" />
      <stop offset="50%" stop-color="#121f15" />
      <stop offset="100%" stop-color="#0a120c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4d371" />
      <stop offset="100%" stop-color="#8daa59" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#080c09" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Shield Body -->
  <path d="M 32 8 L 50 14 C 50 36 32 48 32 54 C 32 48 14 36 14 14 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#greenGrad)" 
        stroke-width="2" />

  <!-- Tactical Ammo / Supply Box in Center -->
  <path d="M 23 23 L 32 18 L 41 23 L 32 28 Z" fill="url(#goldGrad)" />
  <path d="M 23 23 L 32 28 L 32 38 L 23 33 Z" fill="#c68400" />
  <path d="M 41 23 L 32 28 L 32 38 L 41 33 Z" fill="#ffa000" />

  <!-- Glowing Star Badge -->
  <polygon points="32,41 34,45 38.5,45.5 35,48.5 36,53 32,50.5 28,53 29,48.5 25.5,45.5 30,45" 
           fill="url(#goldGrad)" 
           filter="url(#glow)" />
</svg>
