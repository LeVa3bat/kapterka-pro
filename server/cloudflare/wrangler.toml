# Cloudflare Worker: kapterka-api (payments, licenses, fighter registry).
# Secrets are NOT stored here. Set them in Cloudflare Dashboard →
# Workers & Pages → kapterka-api → Settings → Variables and Secrets.
name = "kapterka-api"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

# Workers rate limiting (per key, per Cloudflare location).
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "7302"
simple = { limit = 5, period = 60 }
