name: kapterka-api live health (read-only)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/api-health.yml']

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 20 "https://kapterka-api.alex-666-881.workers.dev/?action=health"; echo
      # Mail relay check: never sends a letter, prints only statuses.
      - run: curl -sS --max-time 40 -X POST -H 'Content-Type: application/json' -d '{}' "https://kapterka-api.alex-666-881.workers.dev/?action=mail_diag"; echo
