name: Firestore next-safe rules safety

on:
  push:
    branches:
      - android/next-safe
    paths:
      - 'server/firestore.next-safe.rules'
      - 'server/firestore-rules-selftest.mjs'
      - 'server/firebase.next-safe.json'
      - '.github/workflows/firestore-next-safe-rules.yml'
  pull_request:
    paths:
      - 'server/firestore.next-safe.rules'
      - 'server/firestore-rules-selftest.mjs'
      - 'server/firebase.next-safe.json'
      - '.github/workflows/firestore-next-safe-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install emulator test tools
        run: npm install --no-save firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14

      - name: Run Firestore rules emulator tests
        run: npx firebase emulators:exec --only firestore --project kapterka-next-safe-rules-test --config server/firebase.next-safe.json "node server/firestore-rules-selftest.mjs"
