name: Android release signer readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SIGNER_SHA256: 843a7e883914f3a7a5a7665ff07b2e8c43da87a24ee4dc35e1600758aee73cb9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KAPTERKA_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KAPTERKA_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KAPTERKA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KAPTERKA_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing KAPTERKA_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KAPTERKA_RELEASE_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/kapterka-release.jks
          chmod 600 /tmp/kapterka-release.jks

      - name: Verify private keystore certificate
        env:
          STORE_PASSWORD: ${{ secrets.KAPTERKA_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          keytool -list -v             -keystore /tmp/kapterka-release.jks             -storepass "$STORE_PASSWORD"             -alias upload | tee /tmp/keytool.txt

          ACTUAL="$(grep -m1 'SHA256:' /tmp/keytool.txt | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(echo "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "Signing key does NOT match the installed/public APK."
            exit 1
          }

      - name: Signer is update-compatible
        run: echo "Release signing key matches current APK certificate."
