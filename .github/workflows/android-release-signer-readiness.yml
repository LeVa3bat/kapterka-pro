name: Android release signer readiness

on:
  workflow_dispatch:
  push:
    branches:
      - android/next-safe
    paths:
      - '.github/workflows/android-release-signer-readiness.yml'

permissions:
  contents: read

jobs:
  verify-release-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SIGNER_SHA256: 843a7e883914f3a7a5a7665ff07b2e8c43da87a24ee4dc35e1600758aee73cb9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KAPTERKA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KAPTERKA_RELEASE_KEYSTORE_B64"; exit 1; }
          # Production 3.4.9 was built with debugConfig:
          # store/key password = android, expected alias = androiddebugkey.
          STORE_PASSWORD="android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/kapterka-release.jks
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          chmod 600 /tmp/kapterka-release.jks

      - name: Verify private keystore certificate
        shell: bash
        run: |
          # Do not assume an alias. The published app was signed with an Android Debug
          # certificate, so the recovered keystore may use androiddebugkey rather than upload.
          keytool -list -v             -keystore /tmp/kapterka-release.jks             -storepass "$STORE_PASSWORD" | tee /tmp/keytool.txt

          EXPECTED="$(echo "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')"
          echo "Expected signer: $EXPECTED"

          MATCHED="$(grep 'SHA256:' /tmp/keytool.txt             | sed 's/.*SHA256:[[:space:]]*//'             | tr -d ':'             | tr '[:upper:]' '[:lower:]'             | grep -Fx "$EXPECTED" || true)"

          test -n "$MATCHED" || {
            echo "No certificate in this keystore matches the installed/public APK."
            exit 1
          }

          echo "Matching signer certificate found."

      - name: Signer is update-compatible
        run: echo "Recovered keystore contains the exact current APK signer certificate."
