name: Payment backend safety

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'server/yandex-cloud-function.js'
      - 'railway.json'
      - 'server/package.json'
      - 'server/railway-server.js'
      - 'server/backend-selftest.js'
      - 'server/firestore.next-safe.rules'
      - '.github/workflows/payment-backend-safety.yml'
  pull_request:
    paths:
      - 'server/yandex-cloud-function.js'
      - 'server/firestore.next-safe.rules'
      - '.github/workflows/payment-backend-safety.yml'

permissions:
  contents: read

jobs:
  payment-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check backend syntax
        run: node --check server/yandex-cloud-function.js

      - name: Check standalone HTTP adapter syntax
        run: node --check server/railway-server.js

      - name: Run backend self-test
        run: node server/backend-selftest.js

      - name: Smoke-test standalone HTTP adapter
        shell: bash
        env:
          PORT: 18080
          YOOKASSA_SHOP_ID: test-shop
          YOOKASSA_SECRET_KEY: test-secret
          FIREBASE_SERVICE_ACCOUNT_JSON: '{"client_email":"test@example.invalid","private_key":"test"}'
          ADMIN_API_SECRET_SHA256: 4e738ca5563c06cfd0018299933d58db1dd8bf97f6973dc99bf6cdc64b5550bd
          ADMIN_SESSION_SECRET: test-admin-session-secret
          BREVO_API_KEY: test-brevo
          EMAIL_SENDER_EMAIL: test@example.invalid
        run: |
          node server/railway-server.js >/tmp/kapterka-backend.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:18080/?action=health" -o /tmp/http-health.json; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/http-health.json
          node -e "const h=require('/tmp/http-health.json'); if(!h.ok || h.service!=='kapterka-payment-api') process.exit(1)"

      - name: Enforce server trust boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('server/yandex-cloud-function.js', 'utf8');
          const required = [
            'YOOKASSA_SECRET_KEY',
            'FIREBASE_SERVICE_ACCOUNT_JSON',
            'PAYMENT_AMOUNT_MISMATCH',
            'LICENSE_REGISTRY_UNAVAILABLE',
            'registerLicenseInFirestore',
            'license_verify',
            'license_restore',
            'fighter_upsert',
            'fighter_lookup',
            'admin_list_fighters',
            'admin_grant_license',
            'send_license_email',
            'license_key',
            'expires_at'
          ];
          for (const token of required) {
            if (!s.includes(token)) throw new Error('Missing payment safety token: ' + token);
          }
          if (/live_[A-Za-z0-9_-]{20,}/.test(s)) {
            throw new Error('Live YooKassa secret must never be committed to server source');
          }
          const fighterUpsertStart = s.indexOf("action === 'fighter_upsert'");
          const fighterLookupStart = s.indexOf("action === 'fighter_lookup'");
          if (fighterUpsertStart < 0 || fighterLookupStart < 0) {
            throw new Error('Fighter backend actions are missing');
          }
          const fighterUpsertBlock = s.slice(fighterUpsertStart, fighterLookupStart);
          if (/body\.(license|expires|isPro)|license_key|expires_at/.test(fighterUpsertBlock)) {
            throw new Error('fighter_upsert must not trust client-supplied license state');
          }
          const adminListStart = s.indexOf("action === 'admin_list_fighters'");
          const adminGrantStart = s.indexOf("action === 'admin_grant_license'");
          if (adminListStart < 0 || adminGrantStart < 0 ||
              !s.slice(adminListStart, adminGrantStart).includes('verifyAdminToken')) {
            throw new Error('admin_list_fighters must require admin token');
          }

          const rules = fs.readFileSync('server/firestore.next-safe.rules', 'utf8');
          for (const collection of ['licenses', 'fighters']) {
            const marker = 'match /' + collection + '/';
            const start = rules.indexOf(marker);
            if (start < 0 || !rules.slice(start, start + 180).includes('allow read, write: if false')) {
              throw new Error(collection + ' is not client-denied in next-safe rules preview');
            }
          }
          console.log('Payment/backend trust-boundary checks PASSED.');
          NODE
