name: Site quality audit

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/site-live-check.mjs'
      - '.github/scripts/lighthouse-budget.mjs'
      - '.github/workflows/site-quality.yml'
      - 'package*.json'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/scripts/lighthouse-budget.mjs'
      - '.github/scripts/build-site-css.mjs'
      - '.github/workflows/site-quality.yml'
      - 'package*.json'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: node .github/scripts/build-site-css.mjs --check
      - name: Start local candidate preview
        run: node tools/growth/serve.mjs &

      - name: Detect Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Lighthouse mobile
        run: >
          npx --yes lighthouse@12
          http://127.0.0.1:4173/
          --quiet
          --chrome-path="$CHROME_BIN"
          --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          --output=json
          --output-path=lh-mobile.json

      - name: Lighthouse desktop
        run: >
          npx --yes lighthouse@12
          http://127.0.0.1:4173/
          --quiet
          --preset=desktop
          --chrome-path="$CHROME_BIN"
          --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          --output=json
          --output-path=lh-desktop.json

      - name: Check quality gates
        run: node .github/scripts/lighthouse-budget.mjs lh-mobile.json lh-desktop.json

      - name: Verify interactions and layouts
        run: node .github/scripts/site-browser-check.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            lh-mobile.json
            lh-desktop.json
            growth/qa/*.png
          retention-days: 14
