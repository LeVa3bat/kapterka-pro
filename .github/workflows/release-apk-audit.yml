name: Release APK audit

on:
  push:
    branches: [main]
    paths:
      - 'docs/kapterka-pro.apk'
      - 'docs/index.html'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/scripts/release-artifact-audit.mjs'
      - '.github/workflows/release-apk-audit.yml'
  pull_request:
    paths:
      - 'docs/kapterka-pro.apk'
      - 'docs/index.html'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/scripts/release-artifact-audit.mjs'
      - '.github/workflows/release-apk-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install APK inspection tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Verify APK signature
        shell: bash
        run: |
          apksigner verify --verbose --print-certs docs/kapterka-pro.apk | tee /tmp/apk-signature.txt

      - name: Read APK metadata
        shell: bash
        run: |
          aapt dump badging docs/kapterka-pro.apk | tee /tmp/apk-badging.txt

      - name: Compare APK with app and website
        run: node .github/scripts/release-artifact-audit.mjs /tmp/apk-badging.txt /tmp/apk-signature.txt
