name: research 4pda topic (read-only)

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/research-4pda.yml']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          pip install -q beautifulsoup4 >/dev/null
          for u in "https://4pda.to/forum/index.php?showtopic=1126094" "https://4pda.to/forum/index.php?showtopic=1126094&view=getnewpost"; do
            curl -sSL -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -H "Accept-Language: ru-RU,ru;q=0.9" "$u" -o page.html -w "HTTP %{http_code} size %{size_download}\n" || true
            python3 - <<'PY'
          from bs4 import BeautifulSoup
          raw=open('page.html','rb').read()
          for enc in ('utf-8','cp1251'):
              try: html=raw.decode(enc); break
              except: pass
          s=BeautifulSoup(html,'html.parser')
          print('TITLE:', s.title.string if s.title else None)
          nav=s.select('.navstrip, #navstrip, .breadcrumbs')
          print('NAV:', [n.get_text(' ',strip=True)[:300] for n in nav][:2])
          posts=s.select('.post_body, .postcolor')
          print('POSTS:', len(posts))
          if posts:
              p=posts[0]
              print('FIRST POST TEXT:\n', p.get_text('\n',strip=True)[:6000])
              print('\nFIRST POST IMG:', [i.get('src') for i in p.select('img')][:30])
              print('\nFIRST POST HTML (head):\n', str(p)[:4000])
          else:
              print(html[:3000])
          PY
          done
