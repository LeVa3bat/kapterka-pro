name: research forms 8/18 (read-only)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/research-forms.yml']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch public legal texts and print the parts about forms 8 and 18
        run: |
          pip install -q beautifulsoup4 >/dev/null
          cat > x.py <<'PY'
          import re, sys, subprocess
          from bs4 import BeautifulSoup
          urls = [
            "http://www.compancommand.com/index/uchet_imushhestva/0-150",
            "http://old.ivo.unn.ru/upmv/g9.htm",
            "https://xn----7sbfkccucpkracijq8iofobm.xn--p1ai/%D0%B2%D0%BE%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F-%D0%BD%D0%B0%D1%83%D0%BA%D0%B0/%D1%80%D1%83%D0%BA%D0%BE%D0%B2%D0%BE%D0%B4%D1%81%D1%82%D0%B2%D0%BE-%D0%B2%D1%8B%D0%BF%D1%83%D1%81%D0%BA%D0%BD%D0%B8%D0%BA%D1%83-%D0%B2%D0%BE%D0%B5%D0%BD%D0%BD%D0%BE%D0%B9-%D0%BA%D0%B0%D1%84%D0%B5%D0%B4%D1%80%D1%8B/%D0%9E%D1%80%D0%B3%D0%B0%D0%BD%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F-%D1%83%D1%87%D0%B5%D1%82%D0%B0-%D0%BC%D0%B0%D1%82%D0%B5%D1%80%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D1%85-%D1%81%D1%80%D0%B5%D0%B4%D1%81%D1%82%D0%B2-%D0%B2-%D0%BF%D0%BE%D0%B4%D1%80%D0%B0%D0%B7%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B8",
          ]
          for u in urls:
            r = subprocess.run(["curl","-sSL","-m","40","-A","Mozilla/5.0",u],capture_output=True)
            html = r.stdout.decode("utf-8","ignore") or r.stdout.decode("cp1251","ignore")
            if "charset=windows-1251" in html.lower():
              html = r.stdout.decode("cp1251","ignore")
            t = BeautifulSoup(html,"html.parser").get_text("\n")
            t = re.sub(r"\n\s*\n+","\n",t)
            print("\n\n######## ", u, " len=", len(t))
            print(t[:30000])
          PY
          python3 x.py | head -c 400000
