name: Site smoke check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/site-smoke.mjs'
      - '.github/workflows/site-smoke.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/scripts/site-smoke.mjs'
      - '.github/workflows/site-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/auth-v2.js

      - name: Check site invariants
        run: node .github/scripts/site-smoke.mjs
