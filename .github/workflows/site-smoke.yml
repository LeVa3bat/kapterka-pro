name: Site smoke check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/growth/**'
      - 'package*.json'
      - '.github/scripts/build-site-css.mjs'
      - '.github/scripts/site-growth-check.mjs'
      - '.github/scripts/workshop-tools.test.cjs'
      - '.github/scripts/site-release-check.mjs'
      - '.github/scripts/site-smoke.mjs'
      - '.github/workflows/site-smoke.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/growth/**'
      - 'package*.json'
      - '.github/scripts/build-site-css.mjs'
      - '.github/scripts/site-growth-check.mjs'
      - '.github/scripts/workshop-tools.test.cjs'
      - '.github/scripts/site-release-check.mjs'
      - '.github/scripts/site-smoke.mjs'
      - '.github/workflows/site-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/auth-v2.js
          node --check docs/workshop-tools.js

      - run: npm ci
      - run: node .github/scripts/build-site-css.mjs --check

      - name: Check site invariants
        run: |
          node .github/scripts/site-smoke.mjs
          node .github/scripts/site-release-check.mjs
          node .github/scripts/site-growth-check.mjs
          node .github/scripts/workshop-tools.test.cjs
          node .github/scripts/site-release-check.test.mjs
