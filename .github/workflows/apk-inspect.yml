name: APK inspect (service providers survive R8)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/apk-inspect.yml']

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the APK that was installed on the phones
        uses: actions/download-artifact@v4
        with:
          name: kapterka-pro-3.6.0
          run-id: 35963165151
          github-token: ${{ github.token }}
          path: apk
      - name: Check META-INF/services providers exist in dex
        shell: bash
        run: |
          set -u
          SDK=/usr/local/lib/android/sdk
          DEXDUMP="$(ls -d $SDK/build-tools/*/dexdump | sort -V | tail -1)"
          cd apk && mkdir x && cd x && unzip -q ../kapterka-pro-3.6.0.apk
          ls META-INF/services || echo "NO META-INF/services at all"
          for d in classes*.dex; do "$DEXDUMP" "$d" | grep "Class descriptor" ; done | sed "s/.*'L//; s/;'//; s#/#.#g" | sort -u > ../classes.txt
          wc -l ../classes.txt
          missing=0
          for f in META-INF/services/*; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f")"
            grep -v '^#' "$f" | sed '/^$/d' | while read -r c; do
              if grep -qx "$c" ../classes.txt; then echo "   ok      $c"; else echo "   MISSING $c"; fi
            done
          done
          echo "grpc classes kept: $(grep -c '^io.grpc' ../classes.txt)"
          grep -E '^io\.grpc\.(okhttp|android)\.' ../classes.txt | head -5
          grep -E 'ManagedChannelProvider|OkHttpChannelProvider|AndroidChannelBuilder' ../classes.txt | head
