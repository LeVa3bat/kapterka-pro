name: Firestore rules

on:
  push:
    paths:
      - 'server/firestore/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'server/firestore/**'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Какие правила выложить в Firebase'
        required: true
        default: 'test-only'
        type: choice
        options:
          - 'test-only'
          - 'transition'   # фаза A: вместе с 3.6, старые версии работают
          - 'strict'       # фаза B: только по команде владельца

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Rules tests in the emulator (both phases)
        run: npx firebase emulators:exec --only firestore --config server/firestore/firebase.json --project demo-kapterka "node server/firestore/rules.test.mjs"

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.phase != 'test-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "GitHub secret FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          node -e "const j=require(process.argv[1]); if(j.project_id!=='kapterka-pro') throw new Error('service account is for '+j.project_id)" "$RUNNER_TEMP/sa.json"
      - name: Deploy ${{ inputs.phase }} rules (Firebase Rules API)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PHASE: ${{ inputs.phase }}
        run: |
          cat > "$RUNNER_TEMP/deploy-rules.mjs" <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const sa = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          const source = fs.readFileSync(`server/firestore/${process.env.PHASE}.rules`, 'utf8');
          const b64 = (o) => Buffer.from(typeof o === 'string' ? o : JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = b64({ alg: 'RS256', typ: 'JWT' }) + '.' + b64({
            iss: sa.client_email, scope: 'https://www.googleapis.com/auth/cloud-platform',
            aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 600 });
          const sig = crypto.createSign('RSA-SHA256').update(unsigned).sign(sa.private_key).toString('base64url');
          const tok = await (await fetch('https://oauth2.googleapis.com/token', { method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: `${unsigned}.${sig}` }) })).json();
          if (!tok.access_token) throw new Error('OAuth failed: ' + JSON.stringify(tok).slice(0, 200));
          const H = { Authorization: 'Bearer ' + tok.access_token, 'Content-Type': 'application/json' };
          const base = `https://firebaserules.googleapis.com/v1/projects/${sa.project_id}`;
          const rs = await (await fetch(`${base}/rulesets`, { method: 'POST', headers: H,
            body: JSON.stringify({ source: { files: [{ name: 'firestore.rules', content: source }] } }) })).json();
          if (!rs.name) throw new Error('Ruleset rejected: ' + JSON.stringify(rs).slice(0, 800));
          console.log('Created ruleset', rs.name);
          const rel = await (await fetch(`${base}/releases/cloud.firestore`, { method: 'PATCH', headers: H,
            body: JSON.stringify({ release: { name: `projects/${sa.project_id}/releases/cloud.firestore`, rulesetName: rs.name } }) })).json();
          if (rel.rulesetName !== rs.name) throw new Error('Release update failed: ' + JSON.stringify(rel).slice(0, 800));
          console.log('Firestore now uses', rel.rulesetName, '(' + process.env.PHASE + ')');
          JS
          node "$RUNNER_TEMP/deploy-rules.mjs"
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
