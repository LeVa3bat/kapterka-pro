name: Android NEXT-SAFE release candidate

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: HTTPS PAYMENT_API_URL that already passed live readiness
        required: true
        type: string
      version_code:
        description: New Android versionCode (>31)
        required: true
        type: string
      version_name:
        description: New Android versionName (for example 3.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  gated-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SIGNER_SHA256: 843a7e883914f3a7a5a7665ff07b2e8c43da87a24ee4dc35e1600758aee73cb9
    steps:
      - name: Require next-safe branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/android/next-safe" || {
            echo "Release candidate may only be built from android/next-safe."
            exit 1
          }

      - name: Validate release inputs
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          case "$BACKEND_URL" in https://*) ;; *) echo "Backend must use HTTPS"; exit 1;; esac
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "versionCode must be numeric"; exit 1; }
          test "$VERSION_CODE" -gt 31 || { echo "versionCode must be > 31"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid versionName"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" "platforms;android-36.1"

      - name: Require recovered production signer
        env:
          KEYSTORE_B64: ${{ secrets.KAPTERKA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "Missing recovered KAPTERKA_RELEASE_KEYSTORE_B64."
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/kapterka-release.jks
          chmod 600 /tmp/kapterka-release.jks
          keytool -list -v -keystore /tmp/kapterka-release.jks -storepass android > /tmp/keytool.txt

          python3 - <<'PY'
          import os, re
          text=open('/tmp/keytool.txt',encoding='utf-8',errors='replace').read()
          expected=os.environ['EXPECTED_SIGNER_SHA256'].lower()
          blocks=re.split(r'(?=Alias name:)', text)
          found=None
          for b in blocks:
              alias=re.search(r'Alias name:\s*([^\r\n]+)', b)
              fp=re.search(r'SHA256:\s*([0-9A-F:]+)', b, re.I)
              if not alias or not fp:
                  continue
              value=fp.group(1).replace(':','').lower()
              if value == expected:
                  found=alias.group(1).strip()
                  break
          if not found:
              raise SystemExit('Recovered keystore does not contain published signer')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('KEY_ALIAS='+found+'\n')
          print('Matched alias:', found)
          PY

      - name: Verify live backend health
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        shell: bash
        run: |
          URL="${BACKEND_URL%/}?action=health"
          curl --fail --silent --show-error --max-time 15 "$URL" -o /tmp/health.json
          node <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          for (const key of ['ok','secretConfigured','licenseRegistryConfigured','adminAuthConfigured','adminSessionConfigured','emailConfigured']) {
            if (h[key] !== true) throw new Error('Backend not release-ready: '+key);
          }
          if (h.service !== 'kapterka-payment-api') throw new Error('Unexpected backend identity');
          NODE

      - name: Reject invalid admin session live
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        shell: bash
        run: |
          URL="${BACKEND_URL%/}?action=admin_list_fighters"
          CODE="$(curl --silent --output /tmp/admin.json --write-out '%{http_code}'             --max-time 15 -H 'Content-Type: application/json'             --data '{"admin_token":"invalid.release.candidate.token"}' "$URL")"
          test "$CODE" = "403"

      - name: Run safety checks and unit tests
        run: |
          node .github/scripts/android-invariants.mjs
          node --check server/yandex-cloud-function.js
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build update-compatible candidate
        env:
          PAYMENT_API_URL: ${{ inputs.backend_url }}
          NEXT_SAFE_VERSION_CODE: ${{ inputs.version_code }}
          NEXT_SAFE_VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PATH: /tmp/kapterka-release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: gradle :app:assembleNextSafeRelease --no-daemon --stacktrace

      - name: Verify candidate package, version and signer
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*nextSafeRelease*.apk' | head -n 1)"
          test -n "$APK"
          aapt dump badging "$APK" | tee /tmp/candidate-badging.txt
          apksigner verify --verbose --print-certs "$APK" | tee /tmp/candidate-signature.txt
          grep -F "package: name='com.aistudio.kapterka.jmwqve' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" /tmp/candidate-badging.txt
          ACTUAL="$(grep -i 'Signer #1 certificate SHA-256 digest:' /tmp/candidate-signature.txt | head -n1 | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED_SIGNER_SHA256"
          echo "RC_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload gated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: kapterka-pro-next-safe-release-candidate
          path: ${{ env.RC_APK }}
          if-no-files-found: error
          retention-days: 7
