name: Android backend release readiness

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public HTTPS PAYMENT_API_URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require HTTPS endpoint
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        shell: bash
        run: |
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "PAYMENT_API_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Check backend health
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        shell: bash
        run: |
          URL="${BACKEND_URL%/}?action=health"
          curl --fail --silent --show-error --max-time 15 "$URL" -o /tmp/health.json
          cat /tmp/health.json
          node <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const requiredTrue = [
            'ok',
            'secretConfigured',
            'licenseRegistryConfigured',
            'adminAuthConfigured',
            'adminSessionConfigured',
            'emailConfigured'
          ];
          for (const key of requiredTrue) {
            if (h[key] !== true) throw new Error('Backend not release-ready: ' + key);
          }
          if (h.service !== 'kapterka-payment-api') {
            throw new Error('Unexpected backend service identity');
          }
          const forbidden = [
            'YOOKASSA_SECRET_KEY',
            'FIREBASE_SERVICE_ACCOUNT_JSON',
            'ADMIN_SESSION_SECRET',
            'BREVO_API_KEY',
            'private_key'
          ];
          const raw = JSON.stringify(h);
          for (const token of forbidden) {
            if (raw.includes(token)) throw new Error('Health response exposes secret material: ' + token);
          }
          console.log('Backend health gate PASSED.');
          NODE

      - name: Reject invalid admin session
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        shell: bash
        run: |
          URL="${BACKEND_URL%/}?action=admin_list_fighters"
          CODE="$(curl --silent --output /tmp/admin.json --write-out '%{http_code}'             --max-time 15             -H 'Content-Type: application/json'             --data '{"admin_token":"invalid.release.readiness.token"}'             "$URL")"
          cat /tmp/admin.json
          test "$CODE" = "403" || {
            echo "Invalid admin session was not rejected with 403 (got $CODE)"
            exit 1
          }

      - name: Backend is release-ready
        run: echo "Payment/license/admin/email backend passed live readiness checks."
