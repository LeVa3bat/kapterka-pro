name: Android next-safe release candidate

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Public HTTPS PAYMENT_API_URL already deployed and configured
        required: true
        type: string
      version_code:
        description: New versionCode (must be greater than 31)
        required: true
        default: '32'
        type: string
      version_name:
        description: New versionName (must not be 3.4.9)
        required: true
        default: '3.5.0-rc1'
        type: string

permissions:
  contents: read

jobs:
  build-gated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SIGNER_SHA256: 843a7e883914f3a7a5a7665ff07b2e8c43da87a24ee4dc35e1600758aee73cb9
      EXPECTED_APPLICATION_ID: com.aistudio.kapterka.jmwqve
      PAYMENT_API_URL: ${{ inputs.backend_url }}
      NEXT_SAFE_VERSION_CODE: ${{ inputs.version_code }}
      NEXT_SAFE_VERSION_NAME: ${{ inputs.version_name }}
      # 3.4.9 uses the standard debug keystore credentials; the private file itself
      # remains the only secret required for signer continuity.
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release candidate inputs
        shell: bash
        run: |
          case "$PAYMENT_API_URL" in
            https://*) ;;
            *) echo "PAYMENT_API_URL must use HTTPS"; exit 1 ;;
          esac

          [[ "$NEXT_SAFE_VERSION_CODE" =~ ^[0-9]+$ ]] || {
            echo "versionCode must be numeric"
            exit 1
          }
          test "$NEXT_SAFE_VERSION_CODE" -gt 31 || {
            echo "versionCode must be greater than production build 31"
            exit 1
          }

          [[ "$NEXT_SAFE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid versionName format"
            exit 1
          }
          test "$NEXT_SAFE_VERSION_NAME" != "3.4.9" || {
            echo "Candidate must not reuse production versionName 3.4.9"
            exit 1
          }

      - name: Verify live backend readiness
        shell: bash
        run: |
          URL="${PAYMENT_API_URL%/}?action=health"
          curl --fail --silent --show-error --max-time 15 "$URL" -o /tmp/health.json
          cat /tmp/health.json

          node <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const required = [
            'ok',
            'secretConfigured',
            'licenseRegistryConfigured',
            'adminAuthConfigured',
            'adminSessionConfigured',
            'emailConfigured'
          ];
          for (const key of required) {
            if (h[key] !== true) throw new Error('Backend not release-ready: ' + key);
          }
          if (h.service !== 'kapterka-payment-api') {
            throw new Error('Unexpected backend service identity');
          }
          const raw = JSON.stringify(h);
          for (const forbidden of [
            'YOOKASSA_SECRET_KEY',
            'FIREBASE_SERVICE_ACCOUNT_JSON',
            'ADMIN_SESSION_SECRET',
            'BREVO_API_KEY',
            'private_key'
          ]) {
            if (raw.includes(forbidden)) throw new Error('Health response leaks secret metadata: ' + forbidden);
          }
          console.log('Live backend readiness PASSED.');
          NODE

          ADMIN_URL="${PAYMENT_API_URL%/}?action=admin_list_fighters"
          CODE="$(curl --silent --output /tmp/admin-invalid.json --write-out '%{http_code}' \
            --max-time 15 \
            -H 'Content-Type: application/json' \
            --data '{"admin_token":"invalid.release.candidate.token"}' \
            "$ADMIN_URL")"
          test "$CODE" = "403" || {
            cat /tmp/admin-invalid.json
            echo "Invalid admin token was not rejected with HTTP 403 (got $CODE)"
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android build and APK inspection tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" "platforms;android-36.1"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Recover and verify exact historical signer
        env:
          KEYSTORE_B64: ${{ secrets.KAPTERKA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KAPTERKA_RELEASE_KEYSTORE_B64"; exit 1; }
          test "$STORE_PASSWORD" = "android" || { echo "Unexpected store password configuration"; exit 1; }
          test "$KEY_PASSWORD" = "android" || { echo "Unexpected key password configuration"; exit 1; }

          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/kapterka-release.jks
          chmod 600 /tmp/kapterka-release.jks
          keytool -list -v -keystore /tmp/kapterka-release.jks -storepass "$STORE_PASSWORD" > /tmp/keytool.txt

          EXPECTED="$(echo "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')"
          ALIAS="$(awk -v expected="$EXPECTED" '
            /^Alias name:/ {
              alias=$0
              sub(/^Alias name:[[:space:]]*/, "", alias)
            }
            /SHA256:/ {
              hash=$0
              sub(/^.*SHA256:[[:space:]]*/, "", hash)
              gsub(/:/, "", hash)
              hash=tolower(hash)
              if (hash == expected) {
                print alias
                exit
              }
            }
          ' /tmp/keytool.txt)"

          test -n "$ALIAS" || {
            echo "Recovered keystore does not contain the published signer."
            exit 1
          }

          echo "Recovered keystore contains the exact published signer."
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=/tmp/kapterka-release.jks" >> "$GITHUB_ENV"

      - name: Run Android safety invariants
        run: node .github/scripts/android-invariants.mjs

      - name: Compile and run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed next-safe candidate
        run: gradle :app:assembleNextSafeRelease --no-daemon --stacktrace

      - name: Locate candidate APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*nextSafeRelease*' | head -n 1)"
          test -n "$APK" || { echo "Candidate APK not found"; exit 1; }
          echo "CANDIDATE_APK=$APK" >> "$GITHUB_ENV"

      - name: Verify candidate signature and metadata
        shell: bash
        run: |
          apksigner verify --verbose --print-certs "$CANDIDATE_APK" | tee /tmp/candidate-signature.txt
          aapt dump badging "$CANDIDATE_APK" | tee /tmp/candidate-badging.txt

          ACTUAL_SIGNER="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/candidate-signature.txt \
            | sed 's/.*digest:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SIGNER="$(echo "$EXPECTED_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER" || {
            echo "Candidate signer mismatch"
            exit 1
          }

          PACKAGE_LINE="$(grep -m1 '^package:' /tmp/candidate-badging.txt)"
          echo "$PACKAGE_LINE" | grep -q "name='$EXPECTED_APPLICATION_ID'" || {
            echo "applicationId mismatch"
            exit 1
          }
          echo "$PACKAGE_LINE" | grep -q "versionCode='$NEXT_SAFE_VERSION_CODE'" || {
            echo "versionCode mismatch"
            exit 1
          }
          echo "$PACKAGE_LINE" | grep -q "versionName='$NEXT_SAFE_VERSION_NAME'" || {
            echo "versionName mismatch"
            exit 1
          }

          if strings "$CANDIDATE_APK" | grep -Eq 'YOOKASSA_SECRET_KEY|api\.yookassa\.ru|ADMIN_SESSION_SECRET|BEGIN PRIVATE KEY'; then
            echo "Candidate contains forbidden secret/server material"
            exit 1
          fi

          sha256sum "$CANDIDATE_APK" | tee /tmp/candidate-sha256.txt

      - name: Compare candidate upgrade surface with production 3.4.9
        shell: bash
        run: |
          STABLE_APK="docs/kapterka-pro.apk"
          test -f "$STABLE_APK" || { echo "Stable APK baseline is missing"; exit 1; }

          aapt dump badging "$STABLE_APK" > /tmp/stable-badging.txt
          aapt dump badging "$CANDIDATE_APK" > /tmp/candidate-badging-upgrade.txt

          STABLE_PACKAGE="$(grep -m1 '^package:' /tmp/stable-badging.txt)"
          CANDIDATE_PACKAGE="$(grep -m1 '^package:' /tmp/candidate-badging-upgrade.txt)"
          echo "$STABLE_PACKAGE" | grep -q "name='$EXPECTED_APPLICATION_ID'" || exit 1
          echo "$CANDIDATE_PACKAGE" | grep -q "name='$EXPECTED_APPLICATION_ID'" || exit 1

          STABLE_CODE="$(echo "$STABLE_PACKAGE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          CANDIDATE_CODE="$(echo "$CANDIDATE_PACKAGE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test "$CANDIDATE_CODE" -gt "$STABLE_CODE" || {
            echo "Candidate is not an upgrade: $CANDIDATE_CODE <= $STABLE_CODE"
            exit 1
          }

          STABLE_MIN="$(grep -m1 "^sdkVersion:" /tmp/stable-badging.txt | sed -n "s/.*'\([^']*\)'.*/\1/p")"
          CANDIDATE_MIN="$(grep -m1 "^sdkVersion:" /tmp/candidate-badging-upgrade.txt | sed -n "s/.*'\([^']*\)'.*/\1/p")"
          test "$CANDIDATE_MIN" = "$STABLE_MIN" || {
            echo "minSdk changed: stable=$STABLE_MIN candidate=$CANDIDATE_MIN"
            exit 1
          }

          STABLE_TARGET="$(grep -m1 "^targetSdkVersion:" /tmp/stable-badging.txt | sed -n "s/.*'\([^']*\)'.*/\1/p")"
          CANDIDATE_TARGET="$(grep -m1 "^targetSdkVersion:" /tmp/candidate-badging-upgrade.txt | sed -n "s/.*'\([^']*\)'.*/\1/p")"
          test "$CANDIDATE_TARGET" -ge "$STABLE_TARGET" || {
            echo "targetSdk regressed: stable=$STABLE_TARGET candidate=$CANDIDATE_TARGET"
            exit 1
          }

          aapt dump permissions "$STABLE_APK" \
            | grep '^uses-permission' \
            | sed "s/.*name='\([^']*\)'.*/\1/" \
            | sort -u > /tmp/stable-permissions.txt || true
          aapt dump permissions "$CANDIDATE_APK" \
            | grep '^uses-permission' \
            | sed "s/.*name='\([^']*\)'.*/\1/" \
            | sort -u > /tmp/candidate-permissions.txt || true

          NEW_PERMISSIONS="$(comm -13 /tmp/stable-permissions.txt /tmp/candidate-permissions.txt)"
          if test -n "$NEW_PERMISSIONS"; then
            echo "Candidate requests new Android permissions:"
            echo "$NEW_PERMISSIONS"
            exit 1
          fi

          echo "Upgrade surface is compatible with production baseline."

      - name: Upload candidate for controlled testing only
        uses: actions/upload-artifact@v4
        with:
          name: kapterka-next-safe-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: ${{ env.CANDIDATE_APK }}
          retention-days: 3
          if-no-files-found: error

      - name: Release candidate gate passed
        run: |
          echo "Candidate built and signed with the exact production signer."
          echo "This workflow does NOT publish, merge, upload to RuStore, or replace docs/kapterka-pro.apk."
