name: Sklad PRO alpha build

on:
  push:
    branches:
      - 'universal/alpha'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/sklad-pro-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sklad-pro-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_ALPHA_SIGNER_SHA256: 6ed709070d92f38fb5580650d08c88042b87ebdc88e457040bc2354a5eadbdb3
      SKLADPRO_API_URL: https://sklad-pro-api.alex-666-881.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" "platforms;android-36.1"

      - name: Restore isolated Alpha signer
        id: alpha-signer-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: sklad-pro-alpha-signer-v1

      - name: Create isolated Alpha signer only once
        shell: bash
        run: |
          if test ! -f debug.keystore; then
            keytool -genkeypair -v               -keystore debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Sklad PRO Alpha,O=Development,C=RU"
          fi
          chmod 600 debug.keystore
          keytool -list -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             | tee /tmp/alpha-keytool.txt
          ACTUAL="$(grep -m1 'SHA256:' /tmp/alpha-keytool.txt             | sed 's/.*SHA256:[[:space:]]*//'             | tr -d ':'             | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED_ALPHA_SIGNER_SHA256" || {
            echo "Alpha signer changed. Refusing to create an update-incompatible APK." >&2
            exit 1
          }

      - name: Verify Sklad PRO backend readiness
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$SKLADPRO_API_URL/health")"
          echo "$HEALTH" | jq -e '
            .ok == true and
            .firebaseProject == "sklad-pro-a1ec0" and
            .firebaseAuthConfigured == true and
            .paymentConfigured == true and
            .plansConfigured == true and
            .demoDays == 3 and
            .entitlementStorage == true
          ' >/dev/null || {
            echo "Sklad PRO backend is not ready for alpha payment testing." >&2
            echo "$HEALTH" | jq .
            exit 1
          }

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build alpha APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify standalone package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BADGING="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$BADGING" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.aistudio.skladpro'" /tmp/badging.txt
          if grep -q "com.aistudio.kapterka.jmwqve" /tmp/badging.txt; then
            echo "Old Kapterka package leaked into Sklad PRO APK" >&2
            exit 1
          fi
          unzip -p "$APK" 'classes*.dex' 2>/dev/null | strings > /tmp/sklad-apk-strings.txt || true
          if grep -qE '946233715306|kapterka-pro-default-rtdb|1:946233715306:android:' /tmp/sklad-apk-strings.txt; then
            echo "Legacy Kapterka Firebase configuration leaked into Sklad PRO APK" >&2
            exit 1
          fi
          grep -q 'sklad-pro-a1ec0' /tmp/sklad-apk-strings.txt || {
            echo "Dedicated Sklad PRO Firebase project id not found in APK" >&2
            exit 1
          }
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"             | tee /tmp/alpha-signature.txt
          ACTUAL_APK_SIGNER="$(grep -m1 'Signer #1 certificate SHA-256 digest:' /tmp/alpha-signature.txt             | sed 's/.*digest:[[:space:]]*//'             | tr -d ':'             | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_APK_SIGNER" = "$EXPECTED_ALPHA_SIGNER_SHA256" || {
            echo "Built APK signer does not match the stable Sklad PRO Alpha signer." >&2
            exit 1
          }
          grep -q 'sklad-pro-api.alex-666-881.workers.dev' /tmp/sklad-apk-strings.txt || {
            echo "Dedicated Sklad PRO Worker URL not found in APK" >&2
            exit 1
          }
          cp "$APK" "Sklad-PRO-0.8.0-alpha20.apk"

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-pro-alpha
          path: Sklad-PRO-0.8.0-alpha20.apk
          if-no-files-found: error
          retention-days: 14
