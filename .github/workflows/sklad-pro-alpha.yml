name: Sklad PRO alpha build

on:
  push:
    branches:
      - 'universal/alpha'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/sklad-pro-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" "platforms;android-36.1"

      - name: Create isolated alpha signer
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Sklad PRO Alpha,O=Development,C=RU"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build alpha APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify standalone package
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BADGING="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          "$BADGING" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.aistudio.skladpro'" /tmp/badging.txt
          if grep -q "com.aistudio.kapterka.jmwqve" /tmp/badging.txt; then
            echo "Old Kapterka package leaked into Sklad PRO APK" >&2
            exit 1
          fi
          cp "$APK" "Sklad-PRO-0.3.0-alpha3.apk"

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-pro-alpha
          path: Sklad-PRO-0.3.0-alpha3.apk
          if-no-files-found: error
          retention-days: 14
