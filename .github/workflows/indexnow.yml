name: IndexNow tests (no submission)

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/indexnow*.mjs'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/site-pages.yml'
  pull_request:
    paths:
      - '.github/scripts/indexnow*.mjs'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test selection, deployment verification, deduplication and retries
        run: node --test .github/scripts/indexnow.test.mjs
