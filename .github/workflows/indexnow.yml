name: Notify search engines

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/privacy.html'
      - 'docs/terms.html'
      - 'docs/security.html'
      - 'docs/updates.html'
      - 'docs/help.html'
      - 'docs/bezopasnoe-obnovlenie-kapterka-pro.html'
      - 'docs/kak-nachat-rabotu-kapterka-pro.html'
      - 'docs/rezervnaya-kopiya-kapterka-pro.html'
      - 'docs/perenos-kapterka-pro-na-novyy-telefon.html'
      - 'docs/sitemap.xml'
      - 'docs/robots.txt'
      - 'docs/site.webmanifest'
      - 'docs/uchet-ostatkov-na-telefone.html'
      - 'docs/uchet-imushchestva-offline.html'
      - 'docs/skladskoy-uchet-android.html'
      - 'docs/guides.html'
      - 'docs/prihod-rashod-sklad-android.html'
      - 'docs/inventarizaciya-na-android.html'
      - 'docs/uchet-vydachi-imushchestva-android.html'
      - 'docs/peremeshchenie-mezhdu-skladami-android.html'
      - 'docs/uchet-tmc-android.html'
      - 'docs/uchet-instrumenta-android.html'
      - 'docs/uchet-oborudovaniya-android.html'
      - 'docs/uchet-inventarya-android.html'
      - 'docs/skladskoy-uchet-dlya-nebolshogo-sklada.html'
      - 'docs/sklad-bez-1c-na-telefone.html'
      - 'docs/zhurnal-dvizheniya-imushchestva-android.html'
      - 'docs/uchet-neskolkih-skladov-android.html'
      - '.github/workflows/indexnow.yml'

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait until the IndexNow key is public
        shell: bash
        run: |
          KEY="903fd952854fcb833f54ad87ef4b033b"
          KEY_URL="https://kapterka-pro.ru/$KEY.txt"
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "$KEY_URL" | tr -d '\r\n' | grep -Fxq "$KEY"; then
              echo "IndexNow key is available."
              exit 0
            fi
            echo "Key is not public yet (attempt $attempt/12)."
            sleep 10
          done
          echo "Key was not published in time; skip notification without blocking the site."
          exit 78
        continue-on-error: true

      - name: Notify IndexNow
        shell: bash
        run: |
          KEY="903fd952854fcb833f54ad87ef4b033b"
          PAYLOAD=$(cat <<JSON
          {
            "host": "kapterka-pro.ru",
            "key": "$KEY",
            "keyLocation": "https://kapterka-pro.ru/$KEY.txt",
            "urlList": [
              "https://kapterka-pro.ru/",
              "https://kapterka-pro.ru/privacy.html",
              "https://kapterka-pro.ru/terms.html",
              "https://kapterka-pro.ru/security.html",
              "https://kapterka-pro.ru/updates.html",
              "https://kapterka-pro.ru/help.html",
              "https://kapterka-pro.ru/bezopasnoe-obnovlenie-kapterka-pro.html",
              "https://kapterka-pro.ru/kak-nachat-rabotu-kapterka-pro.html",
              "https://kapterka-pro.ru/rezervnaya-kopiya-kapterka-pro.html",
              "https://kapterka-pro.ru/perenos-kapterka-pro-na-novyy-telefon.html",
              "https://kapterka-pro.ru/uchet-ostatkov-na-telefone.html",
              "https://kapterka-pro.ru/uchet-imushchestva-offline.html",
              "https://kapterka-pro.ru/skladskoy-uchet-android.html",
              "https://kapterka-pro.ru/inventarizaciya-na-android.html",
              "https://kapterka-pro.ru/uchet-vydachi-imushchestva-android.html",
              "https://kapterka-pro.ru/peremeshchenie-mezhdu-skladami-android.html",
              "https://kapterka-pro.ru/uchet-tmc-android.html",
              "https://kapterka-pro.ru/uchet-instrumenta-android.html",
              "https://kapterka-pro.ru/uchet-oborudovaniya-android.html",
              "https://kapterka-pro.ru/uchet-inventarya-android.html",
              "https://kapterka-pro.ru/skladskoy-uchet-dlya-nebolshogo-sklada.html",
              "https://kapterka-pro.ru/sklad-bez-1c-na-telefone.html",
              "https://kapterka-pro.ru/zhurnal-dvizheniya-imushchestva-android.html",
              "https://kapterka-pro.ru/uchet-neskolkih-skladov-android.html",
              "https://kapterka-pro.ru/prihod-rashod-sklad-android.html",
              "https://kapterka-pro.ru/guides.html"
            ]
          }
          JSON
          )
          HTTP_CODE=$(curl -sS -o /tmp/indexnow-response.txt -w "%{http_code}"             --retry 3 --retry-delay 5 --retry-all-errors             -H "Content-Type: application/json; charset=utf-8"             --data "$PAYLOAD"             "https://api.indexnow.org/indexnow" || true)
          cat /tmp/indexnow-response.txt || true
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "IndexNow accepted the updated URLs (HTTP $HTTP_CODE)."
          else
            echo "::warning::IndexNow notification returned HTTP $HTTP_CODE. The site remains published; the next content update will retry."
          fi
